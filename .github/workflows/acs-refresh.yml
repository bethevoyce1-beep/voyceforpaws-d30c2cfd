name: ACS at-risk refresh

on:
  workflow_dispatch:
    inputs:
      target_table:
        description: "Table to write to (acs_animals_staging = safe, acs_animals = live)"
        required: false
        default: "acs_animals_staging"
  schedule:
    # ACS updates its capacity/euthanasia list roughly every 15 minutes during
    # operating hours, so we poll every 15 min across the Central-time shelter
    # window (times are UTC; CDT = UTC-5). Overnight the list is static, so we
    # skip those hours to stay within GitHub's free Actions minutes.
    - cron: "*/15 11-23 * * *"   # ~6:00 AM - 5:45 PM CT
    - cron: "*/15 0-1 * * *"     # ~6:00 PM - 8:45 PM CT
    # EUTHANASIA WATCH — the 5:30 PM CT cutoff is when euthanasia-room dogs get
    # confirmed. 15 min is too slow to catch it, so poll every 5 min from
    # ~5:00-6:00 PM CT to move a capacity-euthanasia confirmation to In Memoriam
    # within minutes.
    - cron: "*/5 22 * * *"       # 5:00 - 5:55 PM CT (every 5 min)

permissions:
  contents: read

concurrency:
  group: acs-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: acs-pull/requirements.txt
      - name: Install deps
        run: pip install -r acs-pull/requirements.txt
      - name: Pull ACS at-risk animals
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python acs-pull/pull_acs.py
