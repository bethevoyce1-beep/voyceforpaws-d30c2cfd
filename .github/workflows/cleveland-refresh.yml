name: Cleveland City Dogs refresh

on:
  workflow_dispatch:
  schedule:
    # City Dogs Cleveland (open-admission municipal kennel) — refresh the roster
    # every 30 min across kennel hours (times are UTC; Cleveland is Eastern).
    - cron: "*/30 11-23 * * *"   # ~7:00 AM - 7:30 PM ET
    - cron: "*/30 0-1 * * *"     # ~8:00 PM - 9:30 PM ET

permissions:
  contents: read

concurrency:
  group: cleveland-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: acs-pull/requirements.txt
      - name: Install deps
        run: pip install -r acs-pull/requirements.txt
      - name: Pull Cleveland City Dogs roster
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python acs-pull/pull_cleveland.py
